    <main>
      <section class="section floor" id="floor">
        <div class="section-head">
          <p class="kicker">The floor</p>
          <h2>Around the office</h2>
          <p>Photographs from the floor. The rest can wait.</p>
        </div>
        <div class="floor-list">
          <figure>
            <img
              src="img/server-room-beanie.jpg"
              alt="Twelve different coworkers posing in a small server room, machines behind them."
            />
            <figcaption>No windows. Twelve of them, and the machines.</figcaption>
          </figure>
          <figure>
            <img
              src="img/office-desk-art.jpg"
              alt="Developers gathered at a larger wood desk in early evening, a second screen beside the main one, cables across the desk, the city lit outside, a red picture and a yellow picture on the wall."
            />
            <figcaption>Evening, on twenty-three. The screen, and the lights below.</figcaption>
          </figure>
          <figure>
            <img
              src="img/office-fellows.jpg"
              alt="A sunny office with two developers, bookshelves, and the highway outside."
            />
            <figcaption>Sun on the highway. Two of them, and the shelves.</figcaption>
          </figure>
          <figure>
            <img
              src="img/office-desks.jpg"
              alt="Empty desks along the window at dusk, the city lit far below."
            />
            <figcaption>The desks, after the light goes.</figcaption>
          </figure>
          <figure>
            <img
              src="img/office-two.jpg"
              alt="Two women at a glass monitor, the highway behind them."
            />
            <figcaption>Two of them stay with the glass.</figcaption>
          </figure>
          <div class="floor-pair">
            <figure>
              <img
                src="img/office-poster.jpg"
                alt="A woman in a denim jacket straightening a framed Pâtes Blanches poster."
              />
              <figcaption>She levels the poster. Nobody asked.</figcaption>
            </figure>
            <figure>
              <img
                src="img/office-window.jpg"
                alt="A woman at the window after dark, looking down at the highway."
              />
              <figcaption>The window, from the hall.</figcaption>
            </figure>
          </div>
        </div>
